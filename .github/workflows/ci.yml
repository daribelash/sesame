name: ci

# Sprint 1 shape: typecheck, lint, unit and component tests.
# This file grows with the project rather than being retrofitted:
#   sprint 3 — add the e2e job below
#   sprint 5 — add the postgres service to an integration job
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      - name: unit and component tests
        run: npm run test -- --run

      - name: build
        run: npm run build

